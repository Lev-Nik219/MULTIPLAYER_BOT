<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Multiplayer Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .balance {
            background: rgba(255, 215, 0, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: #ffd700;
        }
        .tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
        .tab {
            text-align: center;
            padding: 8px 0;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.6;
        }
        .tab.active { opacity: 1; }
        .tab-icon { font-size: 24px; margin-bottom: 4px; }
        .tab-label { font-size: 11px; }
        
        .games-grid {
            padding: 70px 16px 80px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .game-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .game-card:active { transform: scale(0.96); }
        .game-emoji { font-size: 40px; margin-bottom: 12px; }
        .game-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
        .game-bet { font-size: 12px; opacity: 0.7; }
        
        .card-gold { border-top: 3px solid #ffd700; }
        .card-swamp { border-top: 3px solid #4ade80; }
        .card-pink { border-top: 3px solid #ec4899; }
        .card-purple { border-top: 3px solid #a855f7; }
        
        .profile-container { padding: 70px 16px 80px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
        .stat-card { background: #1a1a2e; border-radius: 12px; padding: 16px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: bold; color: #ffd700; }
        .stat-label { font-size: 12px; opacity: 0.7; margin-top: 4px; }
        
        button {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            color: #000;
            width: 100%;
            cursor: pointer;
            margin: 8px 0;
        }
        .hidden { display: none; }
        
        .game-screen {
            padding: 70px 16px 80px;
            text-align: center;
        }
        .click-button {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50%;
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            cursor: pointer;
            transition: transform 0.05s;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .click-button:active { transform: scale(0.95); }
        
        .vs-box {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            gap: 20px;
        }
        .player-card {
            flex: 1;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .player-score { font-size: 48px; font-weight: bold; color: #ffd700; }
        .timer { font-size: 48px; font-weight: bold; color: #ff4444; margin: 20px 0; }
        .result-badge {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            margin: 20px 0;
            font-size: 24px;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .searching {
            text-align: center;
            padding: 50px;
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎮 MULTIPLAYER ARENA</div>
        <div class="balance">⭐ <span id="balance">0</span></div>
    </div>
    
    <div id="profile-page">
        <div class="profile-container">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="wins">0</div><div class="stat-label">Победы</div></div>
                <div class="stat-card"><div class="stat-value" id="games">0</div><div class="stat-label">Игры</div></div>
                <div class="stat-card"><div class="stat-value" id="winrate">0%</div><div class="stat-label">Winrate</div></div>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="streak">0</div><div class="stat-label">Текущая серия</div></div>
                <div class="stat-card"><div class="stat-value" id="best-streak">0</div><div class="stat-label">Лучшая серия</div></div>
            </div>
            <button onclick="location.reload()">🔄 Обновить</button>
        </div>
    </div>
    
    <div id="games-page" class="hidden">
        <div class="games-grid">
            <div class="game-card card-gold" onclick="startGame('duel_clicker', 3, 30)">
                <div class="game-emoji">⚔️</div>
                <div class="game-title">Дуэль Кликеров</div>
                <div class="game-bet">Ставка: 3⭐</div>
            </div>
            <div class="game-card card-swamp" onclick="startGame('survival_race', 5, 30)">
                <div class="game-emoji">🏁</div>
                <div class="game-title">Гонки на выживание</div>
                <div class="game-bet">Ставка: 5⭐</div>
            </div>
            <div class="game-card card-pink" onclick="startGame('clicker_duel', 2, 30)">
                <div class="game-emoji">🖱️</div>
                <div class="game-title">Кликер Дуэль</div>
                <div class="game-bet">Ставка: 2⭐</div>
            </div>
            <div class="game-card card-purple" onclick="startGame('chess_fast', 10, 30)">
                <div class="game-emoji">♜</div>
                <div class="game-title">Шахматы на скорость</div>
                <div class="game-bet">Ставка: 10⭐</div>
            </div>
        </div>
    </div>
    
    <div id="game-screen" class="hidden">
        <div class="game-screen">
            <div id="game-content"></div>
        </div>
    </div>
    
    <div class="tabs">
        <div class="tab" id="tab-games" onclick="showTab('games')">
            <div class="tab-icon">🎮</div><div class="tab-label">Игры</div>
        </div>
        <div class="tab" id="tab-profile" onclick="showTab('profile')">
            <div class="tab-icon">👤</div><div class="tab-label">Профиль</div>
        </div>
    </div>
    
    <script>
        let tg = window.Telegram?.WebApp;
        let currentUserId = null;
        let ws = null;
        let currentGameId = null;
        let gameInterval = null;
        
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe?.user) {
                currentUserId = tg.initDataUnsafe.user.id;
                loadProfile();
                connectWebSocket();
            }
        }
        
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${currentUserId}`;
            ws = new WebSocket(wsUrl);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };
            
            ws.onclose = () => {
                setTimeout(connectWebSocket, 3000);
            };
        }
        
        function handleWebSocketMessage(data) {
            switch(data.type) {
                case 'searching':
                    document.getElementById('game-content').innerHTML = `
                        <div class="searching">
                            <div>🔍 Поиск соперника...</div>
                            <div style="font-size: 12px; margin-top: 10px;">В очереди: ${data.queue_size}</div>
                            <button onclick="cancelSearch()" style="margin-top: 30px;">Отмена</button>
                        </div>
                    `;
                    break;
                    
                case 'match_found':
                    currentGameId = data.game_id;
                    startGameScreen(data.game_id, data.opponent, data.bet, data.duration);
                    break;
                    
                case 'search_cancelled':
                    showTab('games');
                    break;
                    
                case 'your_click':
                    document.getElementById('my-score').textContent = data.score;
                    break;
                    
                case 'opponent_click':
                    document.getElementById('opponent-score').textContent = data.score;
                    break;
                    
                case 'game_finished':
                    if (gameInterval) clearInterval(gameInterval);
                    let resultText = '';
                    if (data.draw) {
                        resultText = `🤝 НИЧЬЯ! Ставки возвращены.`;
                    } else if (data.winner == currentUserId) {
                        resultText = `🏆 ПОБЕДА! +${data.prize}⭐`;
                    } else {
                        resultText = `💀 ПОРАЖЕНИЕ! -${data.bet}⭐`;
                    }
                    document.getElementById('game-content').innerHTML = `
                        <div class="result-badge">
                            <div style="font-size: 28px;">${data.your_score} : ${data.opponent_score}</div>
                            <div style="margin-top: 20px;">${resultText}</div>
                            <button onclick="showTab('games')" style="margin-top: 30px;">Вернуться в лобби</button>
                        </div>
                    `;
                    loadProfile();
                    currentGameId = null;
                    break;
                    
                case 'game_state':
                    updateTimer(data.remaining);
                    break;
            }
        }
        
        function startGame(gameType, bet, duration) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Подключение к серверу...');
                return;
            }
            ws.send(JSON.stringify({ cmd: 'find_match', game_type: gameType, bet: bet }));
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('games-page').classList.add('hidden');
            document.getElementById('profile-page').classList.add('hidden');
            document.getElementById('game-content').innerHTML = `<div class="searching">🔍 Поиск соперника...</div>`;
        }
        
        function cancelSearch() {
            ws.send(JSON.stringify({ cmd: 'cancel_search', game_type: 'duel_clicker' }));
            showTab('games');
        }
        
        function startGameScreen(gameId, opponent, bet, duration) {
            currentGameId = gameId;
            document.getElementById('game-content').innerHTML = `
                <div class="vs-box">
                    <div class="player-card">
                        <div>ТЫ</div>
                        <div class="player-score" id="my-score">0</div>
                    </div>
                    <div class="player-card">
                        <div>СОПЕРНИК</div>
                        <div class="player-score" id="opponent-score">0</div>
                    </div>
                </div>
                <div class="timer" id="timer">${duration}</div>
                <div class="click-button" onmousedown="sendClick()">
                    🔥
                </div>
                <div style="margin-top: 20px; font-size: 12px; opacity: 0.7;">Ставка: ${bet}⭐</div>
            `;
            
            gameInterval = setInterval(() => {
                ws.send(JSON.stringify({ cmd: 'game_state', game_id: gameId }));
            }, 1000);
        }
        
        function sendClick() {
            if (currentGameId && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ cmd: 'game_click', game_id: currentGameId }));
            }
        }
        
        function updateTimer(remaining) {
            const timerEl = document.getElementById('timer');
            if (timerEl) timerEl.textContent = remaining;
        }
        
        function showTab(tab) {
            const gamesPage = document.getElementById('games-page');
            const profilePage = document.getElementById('profile-page');
            const gameScreen = document.getElementById('game-screen');
            const tabGames = document.getElementById('tab-games');
            const tabProfile = document.getElementById('tab-profile');
            
            gameScreen.classList.add('hidden');
            
            if (tab === 'games') {
                gamesPage.classList.remove('hidden');
                profilePage.classList.add('hidden');
                tabGames.classList.add('active');
                tabProfile.classList.remove('active');
            } else {
                gamesPage.classList.add('hidden');
                profilePage.classList.remove('hidden');
                tabGames.classList.remove('active');
                tabProfile.classList.add('active');
                loadProfile();
            }
        }
        
        async function loadProfile() {
            if (!currentUserId) return;
            try {
                const response = await fetch(`/api/profile/${currentUserId}`);
                const data = await response.json();
                document.getElementById('balance').textContent = (data.balance / 1000).toFixed(0);
                document.getElementById('wins').textContent = data.wins || 0;
                document.getElementById('games').textContent = data.games || 0;
                document.getElementById('winrate').textContent = data.winrate || 0;
                document.getElementById('streak').textContent = data.streak || 0;
                document.getElementById('best-streak').textContent = data.best_streak || 0;
            } catch(e) { console.error(e); }
        }
        
        showTab('games');
    </script>
</body>
</html>
