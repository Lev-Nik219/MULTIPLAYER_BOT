<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Multiplayer Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .balance {
            background: rgba(255, 215, 0, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: #ffd700;
        }
        .tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
        .tab {
            text-align: center;
            padding: 8px 0;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.6;
        }
        .tab.active {
            opacity: 1;
        }
        .tab-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        .tab-label {
            font-size: 11px;
        }
        .games-grid {
            padding: 70px 16px 80px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .game-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .game-card:active {
            transform: scale(0.96);
        }
        .game-emoji {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .game-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .game-bet {
            font-size: 12px;
            opacity: 0.7;
        }
        .card-gold { border-top: 3px solid #ffd700; }
        .card-swamp { border-top: 3px solid #4ade80; }
        .card-pink { border-top: 3px solid #ec4899; }
        .card-purple { border-top: 3px solid #a855f7; }
        .profile-container {
            padding: 70px 16px 80px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .stat-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 4px;
        }
        button {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            color: #000;
            width: 100%;
            cursor: pointer;
            margin: 8px 0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎮 MULTIPLAYER ARENA</div>
        <div class="balance">⭐ <span id="balance">0</span></div>
    </div>
    
    <div id="profile-page">
        <div class="profile-container">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="wins">0</div>
                    <div class="stat-label">Победы</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="games">0</div>
                    <div class="stat-label">Игры</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="winrate">0%</div>
                    <div class="stat-label">Winrate</div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="streak">0</div>
                    <div class="stat-label">Текущая серия</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="best-streak">0</div>
                    <div class="stat-label">Лучшая серия</div>
                </div>
            </div>
            <button onclick="location.reload()">🔄 Обновить</button>
        </div>
    </div>
    
    <div id="games-page" class="hidden">
        <div class="games-grid">
            <div class="game-card card-gold" onclick="startGame('duel_clicker', 3)">
                <div class="game-emoji">⚔️</div>
                <div class="game-title">Дуэль Кликеров</div>
                <div class="game-bet">Ставка: 3⭐</div>
            </div>
            <div class="game-card card-swamp" onclick="startGame('survival_race', 5)">
                <div class="game-emoji">🏁</div>
                <div class="game-title">Гонки на выживание</div>
                <div class="game-bet">Ставка: 5⭐</div>
            </div>
            <div class="game-card card-pink" onclick="startGame('clicker_duel', 2)">
                <div class="game-emoji">🖱️</div>
                <div class="game-title">Кликер Дуэль</div>
                <div class="game-bet">Ставка: 2⭐</div>
            </div>
            <div class="game-card card-purple" onclick="startGame('chess_fast', 10)">
                <div class="game-emoji">♜</div>
                <div class="game-title">Шахматы на скорость</div>
                <div class="game-bet">Ставка: 10⭐</div>
            </div>
        </div>
    </div>
    
    <div class="tabs">
        <div class="tab" id="tab-games" onclick="showTab('games')">
            <div class="tab-icon">🎮</div>
            <div class="tab-label">Игры</div>
        </div>
        <div class="tab" id="tab-profile" onclick="showTab('profile')">
            <div class="tab-icon">👤</div>
            <div class="tab-label">Профиль</div>
        </div>
    </div>
    
    <script>
        let tg = window.Telegram?.WebApp;
        let currentUserId = null;
        
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe?.user) {
                currentUserId = tg.initDataUnsafe.user.id;
                loadProfile();
            }
        }
        
        function showTab(tab) {
            const gamesPage = document.getElementById('games-page');
            const profilePage = document.getElementById('profile-page');
            const tabGames = document.getElementById('tab-games');
            const tabProfile = document.getElementById('tab-profile');
            
            if (tab === 'games') {
                gamesPage.classList.remove('hidden');
                profilePage.classList.add('hidden');
                tabGames.classList.add('active');
                tabProfile.classList.remove('active');
            } else {
                gamesPage.classList.add('hidden');
                profilePage.classList.remove('hidden');
                tabGames.classList.remove('active');
                tabProfile.classList.add('active');
                loadProfile();
            }
        }
        
        async function loadProfile() {
            if (!currentUserId) return;
            try {
                const response = await fetch(`/api/profile/${currentUserId}`);
                const data = await response.json();
                document.getElementById('balance').textContent = (data.balance / 1000).toFixed(0);
                document.getElementById('wins').textContent = data.wins || 0;
                document.getElementById('games').textContent = data.games || 0;
                document.getElementById('winrate').textContent = data.winrate || 0;
                document.getElementById('streak').textContent = data.streak || 0;
                document.getElementById('best-streak').textContent = data.best_streak || 0;
            } catch(e) {
                console.error('Error loading profile:', e);
            }
        }
        
        function startGame(game, bet) {
            alert(`🎮 ${game.toUpperCase()}\nСтавка: ${bet}⭐\n\nРежим разработки. Скоро будет доступно!`);
        }
        
        showTab('games');
    </script>
</body>
</html>
